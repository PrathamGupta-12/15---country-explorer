<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Country Explorer</title>

    <link rel="stylesheet" href="Project15.css">
</head>


<body>


    <header class="navbar">

        <div class="logo">
            🌍 Country Explorer
        </div>

        <div class="theme-toggle">
            <button id="themeBtn">
                🌙 Dark Mode
            </button>
        </div>

    </header>



    <section class="hero">

        <h1>
            Explore Countries Around The World
        </h1>

        <p>
            Search, filter and discover information about every country.
        </p>

    </section>




    <section class="controls">


        <div class="search-box">

            <input 
                type="text" 
                id="searchInput"
                placeholder="🔍 Search for a country..."
            >

        </div>



        <div class="filters">

            <button id="sortName">
                Sort A-Z
            </button>

        </div>


    </section>





    <section class="countries-section">


        <h2>
            Countries
        </h2>


        <div id="countryContainer" class="country-grid">


            <!-- 
                Country Cards will be generated here

                Example:

                <article class="country-card">

                    <img src="flag">

                    <h3>India</h3>

                    <p>Capital: New Delhi</p>

                    <p>Population: 1.4 Billion</p>

                    <p>Region: Asia</p>

                </article>

            -->


        </div>


    </section>





    <footer>

        <p>
            Built with JavaScript Fetch API 🌎
        </p>

    </footer>



    <script src="Project15.js"></script>


</body>

</html>
